[package]
name = "awayguard"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "awayguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` backs the popover's transparent, vibrancy-blurred
# window (tauri.conf.json `transparent` + `windowEffects`). Note that it
# makes the app ineligible for the Mac App Store.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2.189"
btleplug = "0.12.0"
async-trait = "0.1.91"
futures = "0.3.33"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

# The popover has to opt into being shown on every Space, which needs an
# AppKit call `tauri` does not wrap. Same versions `tao` already builds, so
# these cost nothing extra to compile.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder"] }

[dev-dependencies]
# Only needed to construct btleplug PeripheralIds in liveness unit tests.
uuid = "1"

